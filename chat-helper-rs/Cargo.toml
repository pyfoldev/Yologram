[package]
name = "chat-helper"
version = "0.1.0"
edition = "2021"
description = "Chat Helper bot — Rust port (in progress)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
axum = "0.7"
teloxide = { version = "0.13", default-features = false, features = ["rustls", "macros"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"

[dev-dependencies]
